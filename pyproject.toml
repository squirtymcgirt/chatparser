[project]
name = "chatparser"
version = "0.1.0"
description = "Ingest ChatGPT exports into a searchable SQLite corpus for Claude to query."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "sentence-transformers>=3.0",
    "numpy>=2.0",
]

[project.scripts]
chatparser = "chatparser.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chatparser"]
